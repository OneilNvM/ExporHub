networks:
  laravel:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    hostname: api.exporhub.com
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - .:/var/www/app:delegated
      - ./certificates:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - laravel
  
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php
    entrypoint: php artisan octane:frankenphp --host=0.0.0.0 --port=8000 --caddyfile
    restart: unless-stopped
    develop:
      watch:
        - path: ./routes
          action: sync
          target: /var/www/app/routes
        - path: ./database
          action: sync
          target: /var/www/app/database
        - path: ./app
          action: sync
          target: /var/www/app/app
    tty: true
    expose:
      - "8000"
    volumes:
      - .:/var/www/app:delegated
    networks:
      - laravel
    depends_on:
      - db

  db:
    platform: "linux/amd64"
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

volumes:
  dbdata: