[package]
name = "expor-hub-server"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = ["web-assembly-functions"]

[dependencies]
actix-web = { version = "4.9.0", features = ["rustls-0_23"] }
actix-web-lab = "0.23.0"
chrono = "0.4.40"
diesel = { version = "2.2.6", features = ["mysql", "chrono"]}
dotenvy = "0.15.7"
rustls = "0.23.21"
rustls-pemfile = "2.2.0"
serde = {version = "1.0.217", features = ["derive"]} 
serde_json = "1.0.137"
